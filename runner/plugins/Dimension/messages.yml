who-footer: "<dark_aqua>━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

# ─── Coordinates ──────────────────────────────────────────────────────────────
coord-info: "<dark_aqua>━ <gray>World: <yellow>{world} <dark_aqua>│ <gray>X: <white>{x} <gray>Y: <white>{y} <gray>Z: <white>{z} <dark_aqua>│ <gray>Biome: <white>{biome}"

