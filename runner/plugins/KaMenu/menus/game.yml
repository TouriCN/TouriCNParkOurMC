Title: 'TouriCNParkOur｜所有小游戏'

Settings:
  can_escape: true
  after_action: CLOSE
  need_placeholder:
    - player

Body:
  info:
    type: message
    text: "%player_name%，请在以下列表中选择你想游玩的游戏！"

Bottom:
  type: multi
  columns: 1
  buttons:
    new:
      text: ===最新发布===
    SMP:
      text: ==SMP==
    SMP1:
      text: 1号世界
      tooltip:
        - '纯纯生存，没那么多模拟距离当时'
      actions:
        - close
        - console:dim tp smp-1 %player_name%
    SMP2:
      text: 2号世界
      tooltip:
        - '生电来这边'
      actions:
        - close
        - console:dim tp smp-2 %player_name%
  exit:
    text: 关闭菜单
    actions:
      - close
