    wordpressTablePrefix: wp_
settings:
    sessions:
        enabled: true
        timeout: 15
    messagesLanguage: zhcn
    perPlayerLocale: true
    forceVaultHook: false
    logLevel: FINE
    useAsyncTasks: true
    serverName: TouriCNParkOur
    restrictions:
        allowChat: false
        hideChat: true
        allowCommands:
        - /login
        - /log
        - /l
        - /register
        - /reg
        - /email
        - /captcha
        - /2fa
        - /totp
        maxRegPerIp: 0
        minNicknameLength: 3
        maxNicknameLength: 16
        ForceSingleSession: true
        ForceSpawnLocOnJoin:
            enabled: false
            worlds:
            - world
            - world_nether
            - world_the_end
        SaveQuitLocation: true
        AllowRestrictedUser: false
        AllowedRestrictedUser: []
        banUnsafedIP: false
        kickNonRegistered: false
        kickOnWrongPassword: true
        teleportUnAuthedToSpawn: false
        allowMovement: false
        loginTimeout: 60
        registerTimeout: 90
        allowedNicknameCharacters: '[a-zA-Z0-9_.]*'
        allowedMovementRadius: 0
        ProtectInventoryBeforeLogIn: true
        DenyTabCompleteBeforeLogin: true
        displayOtherAccounts: true
        spawnPriority: authme,essentials,cmi,multiverse,default
        maxLoginPerIp: 0
        maxJoinPerIp: 0
        noTeleport: false
        allowedPasswordCharacters: '[!-~]*'
    GameMode:
        ForceSurvivalMode: false
    unrestrictions:
        UnrestrictedName: []
        UnrestrictedInventories: []
    security:
        minPasswordLength: 8
        passwordMaxLength: 30
        passwordHash: BCRYPT
        legacyHashes: []
        doubleMD5SaltLength: 8
        pbkdf2Rounds: 10000
        unsafePasswords:
        - '123456'
        - password
        - qwerty
        - '12345'
        - '54321'
        - '123456789'
        - help
    registration:
        enabled: true
        messageInterval: 5
        force: true
        type: PASSWORD
        secondArg: CONFIRMATION
        forceKickAfterRegister: false
        forceLoginAfterRegister: false
        dialog:
            showForgotPasswordButton: true
            showBody: true
            preJoin:
                enable: true
                showCancelButton: true
                allowCloseWithEscape: false
                registerCancelKicks: false
                loginCancelKicks: true
            postJoin:
                enable: false
    useWelcomeMessage: true
    broadcastWelcomeMessage: false
    delayJoinMessage: true
    customJoinMessage: ''
    removeUnloggedLeaveMessage: true
    removeJoinMessage: false
    removeLeaveMessage: false
    applyBlindEffect: false
    preventOtherCase: true
    enablePremium: false
GroupOptions:
    enablePermissionCheck: false
    registeredPlayerGroup: ''
    unregisteredPlayerGroup: ''
Email:
    mailSMTP: smtp.gmail.com
    mailPort: 465
    useTls: true
    mailAccount: ''
    mailPassword: ''
    mailAddress: ''
    mailSenderName: ''
    RecoveryPasswordLength: 8
    mailSubject: Your new AuthMe password
    maxRegPerEmail: 1
    recallPlayers: false
    delayRecall: 5
    emailBlacklisted:
    - 10minutemail.com
    emailWhitelisted: []
    generateImage: false
    emailOauth2Token: ''
    sslCheckServerIdentity: true
Hooks:
    multiverse: true
    bungeecord: false
    sendPlayerTo: ''
    proxySharedSecret: ''
    disableSocialSpy: false
    useEssentialsMotd: false
Protection:
