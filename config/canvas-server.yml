networking:
   # The ClientboundSetEntityMotionPacket, also known as the entity velocity packet, can often
   # consume major amounts of network usage, often being up to 60% on large production servers
   # This option filters the unnecessary packets sent, while still maintaining Vanilla visual
   # effects
   filter-velocity-packet: false
   # Filters useless move packets that don't need to be sent
   filter-move-packets: false
   # Splits players into buckets to be spread evenly across the playerlist tick
   alternative-player-list-tick: false
   # If alternative playerlist tick is enabled, this is the interval in ticks for how often
   # each bucket will be ticked
   player-info-send-interval: 600
   # Uses a different approach to keepalive ping timeouts. Enabling this sends a keepalive
   # packet once per second to a player, and only kicks for timeout if none of them were
   # responded to in 30 seconds. Responding to any of them in any order will keep the player
   # connected.
   #
   # AKA, it won't kick your players because one packet gets dropped somewhere along the lines
   purpur-alternative-keepalive: false
   # Derived from Leaf, this synchronizes the player immediately when knocked back
   flush-location-while-knockback: false
# The server mod name displayed in server listings and client info
server-mod-name: "Canvas"
# Folia's portaling rewrite makes the world loading screen not display on the client
# properly, and instead shows an empty void. With this enabled, Canvas will display the
# proper world loading screen
display-world-load-screen-for-cross-region-transfers: true
# Whether to cache expensive CraftEntityType#minecraftToBukkit call
cache-minecraft2-bukkit-entity-type-conversion: false
# Enables creation of tile entity snapshots on retrieving blockstates
tile-entity-snapshot-creation: false
purpur-containers:
   # The amount of rows for the barrel block
   barrel-rows: 3
   # Whether to use 6 rows for the player ender chest, rather than the normal 3
   ender-chest-six-rows: false
   # Whether to use a permission based system for defining the size of ender chests per player
   # Valid permissions
   #  - purpur.enderchest.rows.six
   #  - purpur.enderchest.rows.five
   #  - purpur.enderchest.rows.four
   #  - purpur.enderchest.rows.three
   #  - purpur.enderchest.rows.two
   #  - purpur.enderchest.rows.one
   ender-chest-permission-rows: false
   # Whether items should remain stored in slots, even if those slots become inaccessible
   # through permissions
   ender-chest-persist-hidden-rows: true
blacklist-non-player-entities-from-entering-nether-portals: false
blacklist-non-player-entities-from-entering-end-portals: false
blacklist-non-player-entities-from-entering-gateway-portals: false
chat:
   # Disables Minecraft chat signing to prevent player chat reporting
   disable-chat-reporting: false
   # Disables Minecraft chat verification ordering
   disable-chat-verification-order: false
logs:
   # Auto-removes old log files from the "logs" directory
   enable-log-cleaner: false
   # The amount of the time since the log file was last edited until it will be deleted
   cleaner-time-span: "30d"
   # Logs when a pearl is saved or loaded from Canvas' pearl save rewrite
   log-ender-pearl-rewrite-actions: true
enchant-command:
   # Uncaps the max level, allowing you to enchant to any level, even beyond the max
   uncap-max-level: false
   # Allows setting enchants on items that normally do not support that enchantment
   allow-enchants-on-unsupported-items: false
   # Allows setting enchants on items with incompatible enchants. e.g. Protection & Blast
   # Protection
   allow-enchanting-with-incompatible-enchants: false
# Disables the locator bar globally, removing the need to disable it using gamerules
# per-world
disable-locator-bar-in-all-worlds: false
# Folia breaks a lot of autosave features. Canvas restores these, and this section allows
# more specific configuration of autosave functionalities
autosave:
   # The time frequency of how often to autosave the enabled selection. Default is 5 minutes to
   # match upstream
   autosave-frequency: "5m"
   autosave-scoreboards: true
   autosave-stopwatches: true
   autosave-pearls: true
   autosave-custom-boss-events: true
   autosave-time: true
   autosave-maps: true
   autosave-weather: true
   autosave-gamerules: true
   autosave-players: true
