   # Fixes blocks of raw copper using stone sounds instead of copper sounds
   # https://bugs.mojang.com/browse/MC/issues/MC-223153
   mc223153: false
   # Fixes cured baby zombies staying as jockey variants
   # https://bugs.mojang.com/browse/MC/issues/MC-200418
   mc200418: false
   # Fixes cave spiders and spiders with the small scale attribute spinning around when walking
   # https://bugs.mojang.com/browse/MC/issues/MC-94054
   mc94054: false
   # Fixes raid horn blare sounds being controlled by the Friendly Creatures sound slider
   # https://bugs.mojang.com/browse/MC/issues/MC-245394
   mc245394: false
   # Fixes explosion sounds and particles not being produced when a shulker bullet hits an
   # entity
   # https://bugs.mojang.com/browse/MC/issues/MC-227337
   mc227337: false
   # Fixes shulker bullets not producing bubble particles when moving through water
   # https://bugs.mojang.com/browse/MC/issues/MC-221257
   mc221257: false
   # Fixes item drops by entities that were killed by lightning instantly disappearing
   # https://bugs.mojang.com/browse/MC/issues/MC-206922
   mc206922: false
   # Fixes dying puffed pufferfishes still stinging players
