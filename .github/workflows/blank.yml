name: Minecraft Server (5-Day Chain)

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  REPO: ${{ github.repository }}
  BRANCH: ${{ github.ref_name }}
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  # ═══════════════════════════════════════
  # Day 1 — 跑 1 天
  # ═══════════════════════════════════════
  server-day-1:
    runs-on: self-hosted
    timeout-minutes: 1440
    steps: &server-steps          # ← 定义锚点，后面直接复用
      # ── Step 1: 准备 Java ──
      - name: ☕ Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'

      # ── Step 2: Git 初始化 & 拉取 ──
      - name: 📦 Git Init & Pull
        run: |
          cd /home/container
          if [ ! -d .git ]; then
            git init
            git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
            git fetch origin
            git checkout -b "$BRANCH" "origin/$BRANCH"
          fi
          git config pull.rebase true
          git stash --include-untracked || true
          git fetch origin "$BRANCH" || true
          git reset --hard "origin/$BRANCH" || true
          git stash pop 2>/dev/null || true

      # ── Step 3: 下载依赖 ──
      - name: 📥 Download Dependencies
        run: |
          cd /home/container/runner
          if [ ! -f leaf.jar ]; then
            curl -fL -o leaf.jar "https://github.com/Winds-Studio/Leaf/releases/download/ver-26.2/leaf-26.2-83.jar"
            chmod +x leaf.jar
          fi
          if [ ! -f mcrcon ]; then
            curl -fL -o mcrcon.c https://raw.githubusercontent.com/Tiiffi/mcrcon/master/mcrcon.c
            gcc -std=gnu11 -Wall -Wextra -Wpedantic -Os mcrcon.c -o mcrcon
            chmod +x mcrcon; rm -f mcrcon.c
          fi
          [ ! -f eula.txt ] && echo "eula=true" > eula.txt || true

      # ── Step 4: 启动服务器（前台跑一整天）──
      - name: 🚀 Start Server Loop
        run: |
          cd /home/container/runner
          RCON_PORT=$(grep "^rcon.port=" server.properties | cut -d"=" -f2)
          RCON_PASSWORD=$(grep "^rcon.password=" server.properties | cut -d"=" -f2)

          # 推送函数
          push() {
            cd /home/container
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git stash --include-untracked || true
            git fetch origin "$BRANCH" || true
            git reset --hard "origin/$BRANCH" || true
            git stash pop 2>/dev/null || true
            git add -A runner/ || true
            git reset HEAD runner/TouriCNParkOur runner/logs runner/leaf.jar runner/mcrcon 2>/dev/null || true
            if [ -n "$(git status --porcelain)" ]; then
              git commit -m "sync: runner [no ci]" || true
              git push "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" "HEAD:$BRANCH" || echo "⚠️ push failed, will retry next cycle"
            fi
            cd runner
          }

          # 关停陷阱
          trap '
            ./mcrcon -H 127.0.0.1 -P "$RCON_PORT" -p "$RCON_PASSWORD" "kick @a 服务器重启中..." || true
            sleep 5
            ./mcrcon -H 127.0.0.1 -P "$RCON_PORT" -p "$RCON_PASSWORD" "save-all" || true
            sleep 5; push
            find . -mindepth 1 -maxdepth 1 ! -name "TouriCNParkOur" -exec rm -rf {} +
            kill -15 $JAVA_PID 2>/dev/null
            exit 0
          ' SIGTERM

          # 启动 Leaf
          java -Xms10G -Xmx10G \
               -server \
               -DLeaf.enableFMA=true \
               -XX:+UseG1GC \
               -XX:+UseCompressedOops \
               -XX:+UseStringDeduplication \
               -XX:+ParallelRefProcEnabled \
               -XX:MaxGCPauseMillis=200 \
               -XX:+UnlockExperimentalVMOptions \
               -XX:+DisableExplicitGC \
               -XX:+AlwaysPreTouch \
               -XX:G1NewSizePercent=30 \
               -XX:G1MaxNewSizePercent=40 \
               -XX:G1HeapRegionSize=16M \
               -XX:G1ReservePercent=20 \
               -XX:G1HeapWastePercent=5 \
               -XX:G1MixedGCCountTarget=4 \
               -XX:InitiatingHeapOccupancyPercent=15 \
               -XX:G1MixedGCLiveThresholdPercent=90 \
               --add-modules=jdk.incubator.vector \
               -Dlevel-name="TouriCNParkOur" \
               -jar leaf.jar --nogui > server.log 2>&1 &

          JAVA_PID=$!
          COUNT=0
          while kill -0 $JAVA_PID 2>/dev/null; do
            sleep 30; COUNT=$((COUNT+1))
            cd /home/container
            git stash --include-untracked || true
            git fetch origin "$BRANCH" || true
            git reset --hard "origin/$BRANCH" || true
            git stash pop 2>/dev/null || true
            cd runner
            if [ $COUNT -ge 20 ]; then
              COUNT=0
              ./mcrcon -H 127.0.0.1 -P "$RCON_PORT" -p "$RCON_PASSWORD" "save-all" || true
              sleep 5; push
            fi
          done

  # ═══════════════════════════════════════
  # Day 2 — 跑 1 天（复用 Day 1 的全部 steps）
  # ═══════════════════════════════════════
  server-day-2:
    needs: server-day-1
    runs-on: self-hosted
    timeout-minutes: 1440
    steps: *server-steps

  # ═══════════════════════════════════════
  # Day 3 — 跑 1 天
  # ═══════════════════════════════════════
  server-day-3:
    needs: server-day-2
    runs-on: self-hosted
    timeout-minutes: 1440
    steps: *server-steps

  # ═══════════════════════════════════════
  # Day 4 — 跑 1 天
  # ═══════════════════════════════════════
  server-day-4:
    needs: server-day-3
    runs-on: self-hosted
    timeout-minutes: 1440
    steps: *server-steps

  # ═══════════════════════════════════════
  # Day 5 — 跑 0.8 天（1152 min），收尾
  # ═══════════════════════════════════════
  server-day-5:
    needs: server-day-4
    runs-on: self-hosted
    timeout-minutes: 1152
    steps: *server-steps
