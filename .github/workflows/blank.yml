name: Minecraft Server

on:
  workflow_dispatch:
    inputs:
      debug:
        description: '调试模式（关闭时不踢玩家、不创建到期提醒 Issue）'
        required: false
        default: false
        type: boolean

jobs:
  run-server:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.FINE_GRAINED_PAT }}

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Download Leaf (latest 26.2 build via v2 API)
        run: |
          echo "Fetching latest Leaf 26.2 build number..."
          LATEST_BUILD=$(curl -s "https://api.leafmc.one/v2/projects/leaf/versions/26.2/latestGroupBuildId")
          echo "Latest build: #$LATEST_BUILD"
          curl -L -o leaf.jar \
            "https://api.leafmc.one/v2/projects/leaf/versions/26.2/builds/$LATEST_BUILD/downloads/leaf-26.2-$LATEST_BUILD.jar"
          if [ ! -f leaf.jar ]; then
            echo "ERROR: Leaf download failed"
            exit 1
          fi
          chmod +x leaf.jar
          echo "Leaf #$LATEST_BUILD downloaded."

      - name: Download playit
        run: |
          curl -L -o playit-linux-amd64 \
            "https://github.com/playit-cloud/playit-agent/releases/latest/download/playit-linux-amd64"
          chmod +x playit-linux-amd64

      - name: Prepare playit config
        run: |
          mkdir -p ~/.config/playit_gg
          if [ -n "${{ secrets.PLAYIT_SECRET }}" ]; then
            echo "${{ secrets.PLAYIT_SECRET }}" > ~/.config/playit_gg/playit.toml
          fi

      - name: Run server
        env:
          FINE_GRAINED_PAT: ${{ secrets.FINE_GRAINED_PAT }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          RUN_ID: ${{ github.run_id }}
          PLAYIT_SECRET: ${{ secrets.PLAYIT_SECRET }}
          DEBUG: ${{ github.event.inputs.debug }}
        run: |
          cd "$GITHUB_WORKSPACE"

          # 首次运行接受 EULA
          echo "eula=true" > eula.txt

          # 启动 playit（首次需交互认领，后续用 secret）
          if [ -z "$PLAYIT_SECRET" ]; then
            echo "=========================================="
            echo "NO PLAYIT_SECRET - interactive claim mode"
            echo "=========================================="
            ./playit-linux-amd64 > playit.log 2>&1 &
            PLAYIT_PID=$!
            sleep 60
            CLAIM_URL=$(grep -o 'https://playit.gg/claim/[A-Za-z0-9]*' playit.log | head -1)
            if [ -n "$CLAIM_URL" ]; then
              echo "CLAIM URL: $CLAIM_URL"
            fi
            # 等待认领（最多 5 分钟）
            for i in $(seq 1 150); do
              sleep 2
              if grep -q "Program approved" playit.log 2>/dev/null; then
                echo "Claim successful! Copy playit.toml content into PLAYIT_SECRET."
                cat ~/.config/playit_gg/playit.toml || true
                break
              fi
            done
          else
            ./playit-linux-amd64 2>&1 | sed '/login:/s/.*/<REDACTED>/' &
            PLAYIT_PID=$!
          fi

          # SIGTERM 处理
          trap '
            echo "Received SIGTERM - emergency save..."
            if [ "$DEBUG" != "true" ]; then
              RCON_PASSWORD=$(grep "^rcon.password=" server.properties | cut -d"=" -f2)
              mcrcon -H 127.0.0.1 -P 25575 -p "$RCON_PASSWORD" \
                "kick @a 工作流即将关闭，请等待下次手动启动。查看运行状态: https://github.com/$REPO/actions" || true
              sleep 5
            fi
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -A
            git reset -- leaf.jar
            git reset -- playit-linux-amd64
            git reset -- "*.zip" || true
            git commit -m "emergency save before shutdown [no ci]" || true
            git push "https://x-access-token:${FINE_GRAINED_PAT}@github.com/${REPO}.git" \
              "HEAD:${BRANCH}" --force || true
          ' SIGTERM

          # 启动 Leaf
          java -Xms2G -Xmx6G \
               -server \
               -DLeaf.enableFMA=true \
               -XX:+UseG1GC \
               -XX:+UseCompressedOops \
               -XX:+UseStringDeduplication \
               -XX:+ParallelRefProcEnabled \
               -XX:MaxGCPauseMillis=200 \
               -XX:+UnlockExperimentalVMOptions \
               -XX:+DisableExplicitGC \
               -XX:+AlwaysPreTouch \
               -XX:G1NewSizePercent:30 \
               -XX:G1MaxNewSizePercent:40 \
               -XX:G1HeapRegionSize:8M \
               -XX:G1ReservePercent:20 \
               -XX:G1HeapWastePercent:5 \
               -XX:G1MixedGCCountTarget:4 \
               -XX:InitiatingHeapOccupancyPercent:15 \
               -XX:G1MixedGCLiveThresholdPercent:90 \
               --add-modules=jdk.incubator.vector \
               -jar leaf.jar --nogui 2>&1 | sed '/login:/s/.*/<REDACTED>/' &

          SERVER_PID=$!

          # 主循环：定时同步
          START_TIME=$(date +%s)
          WARNED=""
          while kill -0 $SERVER_PID 2>/dev/null; do
            sleep 600
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -A
            git reset -- leaf.jar
            git reset -- playit-linux-amd64
            git reset -- "*.zip" || true
            git commit -m "sync: world data [no ci]" || true
            git push "https://x-access-token:${FINE_GRAINED_PAT}@github.com/${REPO}.git" \
              "HEAD:${BRANCH}" --force || true

            CURRENT=$(date +%s)
            ELAPSED=$((CURRENT - START_TIME))
            if [ $ELAPSED -ge 20400 ] && [ -z "$WARNED" ]; then
              WARNED=1
              if [ "$DEBUG" != "true" ]; then
                curl -s -X POST \
                  -H "Authorization: token $FINE_GRAINED_PAT" \
                  -H "Accept: application/vnd.github.v3+json" \
                  "https://api.github.com/repos/$REPO/issues" \
                  -d '{"title":"服务器即将关闭 - 手动启动新实例","body":"工作流已运行约 5 小时 40 分钟，即将达到 6 小时限制。请前往 Actions 页面手动点击 Run workflow 启动新服务器。"}' > /dev/null
              fi
            fi
          done

          # 关闭
          kill $PLAYIT_PID 2>/dev/null || true
          wait $PLAYIT_PID 2>/dev/null || true
