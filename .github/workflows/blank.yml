name: Minecraft Server

on:
  workflow_dispatch:

jobs:
  run-server:
    runs-on: self-hosted
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync repo runner/ to local (first boot)
        run: |
          if [ -d "$GITHUB_WORKSPACE/runner" ]; then
            mkdir -p /home/container/runner
            rsync -av --exclude='TouriCNParkOur/' --exclude='leaf.jar' --exclude='*.zip' --exclude='logs/latest.log' \
              "$GITHUB_WORKSPACE/runner/" /home/container/runner/
            echo "First boot: synced repo runner/ → /home/container/runner/"
          else
            echo "No runner/ in repo, using local /home/container/runner/ as-is."
          fi

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Run server
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        run: |
          cd /home/container/runner

          if [ ! -f leaf.jar ]; then
            echo "Downloading Leaf..."
            LATEST_BUILD=$(curl -s "https://api.leafmc.one/v2/projects/leaf/versions/26.2/latestGroupBuildId")
            curl -L -o leaf.jar \
              "https://api.leafmc.one/v2/projects/leaf/versions/26.2/builds/$LATEST_BUILD/downloads/leaf-26.2-$LATEST_BUILD.jar"
            chmod +x leaf.jar
            echo "Leaf #$LATEST_BUILD downloaded."
          fi

          if [ ! -f eula.txt ]; then
            echo "eula=true" > eula.txt
          fi

          maybe_commit() {
            rsync -av --exclude='TouriCNParkOur/' --exclude='leaf.jar' --exclude='*.zip' --exclude='logs/latest.log' \
              /home/container/runner/ "$GITHUB_WORKSPACE/runner/"
            cd "$GITHUB_WORKSPACE"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add runner/
            if [ -n "$(git status --porcelain)" ]; then
              git commit -m "sync: runner config and plugins [no ci]"
              git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${REPO}.git" "HEAD:${BRANCH}" --force
              echo "Changes committed and pushed."
            else
              echo "No changes, skipping."
            fi
            cd /home/container/runner
          }

          trap '
            echo "Received SIGTERM - emergency save..."
            RCON_PASSWORD=$(grep "^rcon.password=" server.properties | cut -d"=" -f2)
            mcrcon -H 127.0.0.1 -P 25575 -p "$RCON_PASSWORD" "kick @a 服务器即将关闭。" || true
            sleep 5
            mcrcon -H 127.0.0.1 -P 25575 -p "$RCON_PASSWORD" "save-all" || true
            sleep 5
            maybe_commit
          ' SIGTERM

          java -Xms10G -Xmx10G \
               -server \
               -DLeaf.enableFMA=true \
               -XX:+UseG1GC \
               -XX:+UseCompressedOops \
               -XX:+UseStringDeduplication \
               -XX:+ParallelRefProcEnabled \
               -XX:MaxGCPauseMillis=200 \
               -XX:+UnlockExperimentalVMOptions \
               -XX:+DisableExplicitGC \
               -XX:+AlwaysPreTouch \
               -XX:G1NewSizePercent=30 \
               -XX:G1MaxNewSizePercent:40 \
               -XX:G1HeapRegionSize=16M \
               -XX:G1ReservePercent:20 \
               -XX:G1HeapWastePercent:5 \
               -XX:G1MixedGCCountTarget:4 \
               -XX:InitiatingHeapOccupancyPercent:15 \
               -XX:G1MixedGCLiveThresholdPercent:90 \
               --add-modules=jdk.incubator.vector \
               -Dlevel-name="TouriCNParkOur" \
               -jar leaf.jar --nogui 2>&1 | sed '/login:/s/.*/<REDACTED>/' &

          SERVER_PID=$!

          # 主循环：30 秒拉配置 + 10 分钟存档推送
          LOOP_COUNT=0
          while kill -0 $SERVER_PID 2>/dev/null; do
            sleep 30
            LOOP_COUNT=$((LOOP_COUNT + 1))

            # 每 30 秒：从 GitHub 拉最新配置到本地
            cd "$GITHUB_WORKSPACE"
            git pull "https://x-access-token:${GITHUB_TOKEN}@github.com/${REPO}.git" "$BRANCH" || true
            rsync -av --exclude='TouriCNParkOur/' --exclude='leaf.jar' --exclude='*.zip' --exclude='logs/latest.log' \
              "$GITHUB_WORKSPACE/runner/" /home/container/runner/
            cd /home/container/runner

            # 每 10 分钟（30s × 20 = 600s）：存档 + 推本地改动
            if [ $LOOP_COUNT -ge 20 ]; then
              LOOP_COUNT=0
              RCON_PASSWORD=$(grep "^rcon.password=" server.properties | cut -d"=" -f2)
              mcrcon -H 127.0.0.1 -P 25575 -p "$RCON_PASSWORD" "save-all" || true
              sleep 5
              maybe_commit
            fi
          done
