name: Minecraft Server

on:
  workflow_dispatch:

env:
  REPO: ${{ github.repository }}
  BRANCH: ${{ github.ref_name }}
  GH_TOKEN: ${{ secrets.PAT }}   # ← 你的 PAT，不过期

jobs:
  server:
    runs-on: self-hosted
    timeout-minutes: 6480        # 4.5 天，到时间 GitHub 发 SIGTERM 自毁
    permissions:
      contents: write

    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Run Server
        run: |
          cd /home/container

          # ── 初始化 git（首次）──
          if [ ! -d .git ]; then
            git init
            git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
            git fetch origin
            git checkout -b "$BRANCH" "origin/$BRANCH"
          fi

          git config pull.rebase true

          # ── 启动时拉取：远端是真相源 ──
          git stash --include-untracked || true
          git fetch origin "$BRANCH"
          git reset --hard "origin/$BRANCH"
          git stash pop 2>/dev/null || true

          cd runner

          # ── 下载依赖 ──
          if [ ! -f leaf.jar ]; then
            curl -fL -o leaf.jar "https://github.com/Winds-Studio/Leaf/releases/download/ver-26.2/leaf-26.2-83.jar"
            chmod +x leaf.jar
          fi
          if [ ! -f mcrcon ]; then
            curl -fL -o mcrcon.c https://raw.githubusercontent.com/Tiiffi/mcrcon/master/mcrcon.c
            gcc -std=gnu11 -Wall -Wextra -Wpedantic -Os mcrcon.c -o mcrcon
            chmod +x mcrcon
            rm -f mcrcon.c
          fi
          [ ! -f eula.txt ] && echo "eula=true" > eula.txt

          # ── RCON ──
          RCON_PORT=$(grep "^rcon.port=" server.properties | cut -d"=" -f2)
          RCON_PASSWORD=$(grep "^rcon.password=" server.properties | cut -d"=" -f2)

          # ── 推送函数：本地是真相源 ──
          push() {
            cd /home/container
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"

            # 先以远端为准拉最新，再把本地修改叠上去
            git stash --include-untracked || true
            git fetch origin "$BRANCH"
            git reset --hard "origin/$BRANCH"
            git stash pop 2>/dev/null || true

            git add runner/
            if [ -n "$(git status --porcelain)" ]; then
              git commit -m "sync: runner [no ci]"
              git push "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" "HEAD:$BRANCH"
            fi
            cd runner
          }

          # ── 关停陷阱：4.5 天到了 GitHub 发 SIGTERM 就走这里 ──
          trap '
            ./mcrcon -H 127.0.0.1 -P "$RCON_PORT" -p "$RCON_PASSWORD" "kick @a 服务器即将重启。" || true
            sleep 5
            ./mcrcon -H 127.0.0.1 -P "$RCON_PORT" -p "$RCON_PASSWORD" "save-all" || true
            sleep 5
            push
            find . -mindepth 1 -maxdepth 1 ! -name "TouriCNParkOur" -exec rm -rf {} +
            kill -15 $SERVER_PID 2>/dev/null
            exit 0
          ' SIGTERM

          # ── 启动 ──
          java -Xms10G -Xmx10G \
               -server \
               -DLeaf.enableFMA=true \
               -XX:+UseG1GC \
               -XX:+UseCompressedOops \
               -XX:+UseStringDeduplication \
               -XX:+ParallelRefProcEnabled \
               -XX:MaxGCPauseMillis=200 \
               -XX:+UnlockExperimentalVMOptions \
               -XX:+DisableExplicitGC \
               -XX:+AlwaysPreTouch \
               -XX:G1NewSizePercent=30 \
               -XX:G1MaxNewSizePercent=40 \
               -XX:G1HeapRegionSize=16M \
               -XX:G1ReservePercent=20 \
               -XX:G1HeapWastePercent=5 \
               -XX:G1MixedGCCountTarget=4 \
               -XX:InitiatingHeapOccupancyPercent=15 \
               -XX:G1MixedGCLiveThresholdPercent=90 \
               --add-modules=jdk.incubator.vector \
               -Dlevel-name="TouriCNParkOur" \
               -jar leaf.jar --nogui &
          SERVER_PID=$!

          # ── 主循环 ──
          COUNT=0
          while kill -0 $SERVER_PID 2>/dev/null; do
            sleep 30
            COUNT=$((COUNT+1))

            # 每 30 秒：远端是真相源
            cd /home/container
            git stash --include-untracked || true
            git fetch origin "$BRANCH"
            git reset --hard "origin/$BRANCH"
            git stash pop 2>/dev/null || true
            cd runner

            # 每 10 分钟：本地保存 + 推送
            if [ $COUNT -ge 20 ]; then
              COUNT=0
              ./mcrcon -H 127.0.0.1 -P "$RCON_PORT" -p "$RCON_PASSWORD" "save-all" || true
              sleep 5
              push
            fi
          done
