name: Execute Command

on:
  workflow_dispatch:
    inputs:
      command:
        description: '要执行的 Minecraft 命令（不需要带 /，直接写 gamerule xxx 或 tp xxx）'
        required: true
        type: string

jobs:
  execute:
    runs-on: self-hosted
    steps:
      - name: Execute and Capture Output
        run: |
          cd /home/container/runner

          # 从 server.properties 读取 RCON 配置
          RCON_PORT=$(grep "^rcon.port=" server.properties | cut -d"=" -f2)
          RCON_PASSWORD=$(grep "^rcon.password=" server.properties | cut -d"=" -f2)

          echo "╔══════════════════════════════════════╗"
          echo "  执行命令: ${{ inputs.command }}"
          echo "  RCON 端口: $RCON_PORT"
          echo "╚══════════════════════════════════════╝"
          echo ""

          # 用管道：等 2 秒连上 → 发命令 → 再监听 10 秒输出 → 自动退出
          (
            sleep 2
            echo "${{ inputs.command }}"
            sleep 10
          ) | ./mcrcon -t -H 127.0.0.1 -P "$RCON_PORT" -p "$RCON_PASSWORD"

          echo ""
          echo "✅ 命令执行完毕，10 秒监听结束"
