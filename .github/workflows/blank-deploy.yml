name: Deploy (unpack)

on:
  workflow_dispatch:
    inputs:
      packages:
        description: '要解压的包，多个用空格分隔。支持 server.zip / halfserver*.zip / 任意名字.zip。留空则自动扫描所有 zip'
        required: false
        default: ''
      target_dir:
        description: '解压目标根目录（相对于仓库根）。留空则解压到每个 zip 所在目录'
        required: false
        default: ''

jobs:
  deploy:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Unpack packages
        env:
          PACKAGES: ${{ github.event.inputs.packages }}
          TARGET_DIR: ${{ github.event.inputs.target_dir }}
        run: |
          cd "$GITHUB_WORKSPACE"

          if [ -n "$PACKAGES" ]; then
            ZIPS=""
            for name in $PACKAGES; do
              if [ -f "$name" ]; then
                ZIPS="$ZIPS $name"
              else
                FOUND=$(find . -type f -name "$name" | head -1)
                if [ -n "$FOUND" ]; then
                  ZIPS="$ZIPS $FOUND"
                else
                  echo "WARNING: package not found: $name"
                fi
              fi
            done
          else
            ZIPS=$(find . -type f -name "*.zip" | grep -v ".git/" | tr '\n' ' ')
          fi

          if [ -z "$ZIPS" ]; then
            echo "No zip packages found to unpack."
            exit 0
          fi

          echo "Packages to unpack:$ZIPS"

          for zipfile in $ZIPS; do
            zdir=$(dirname "$zipfile")
            if [ -n "$TARGET_DIR" ]; then
              dest="$GITHUB_WORKSPACE/$TARGET_DIR"
            else
              dest="$GITHUB_WORKSPACE/$zdir"
            fi
            echo "Unpacking $zipfile -> $dest/"
            mkdir -p "$dest"
            unzip -o "$zipfile" -d "$dest"
            rm -f "$zipfile"
          done

      - name: Commit and push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "deploy: unpack packages [no ci]" || echo "nothing to commit"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git" \
            "HEAD:${{ github.ref_name }}" --force || echo "push failed"
