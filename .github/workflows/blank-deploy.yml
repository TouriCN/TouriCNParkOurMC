name: Deploy (unpack)

on:
  workflow_dispatch:
    inputs:
      packages:
        description: '要解压的包名，多个用空格分隔。如：server.zip 或 world/halfserver1.zip world/halfserver2.zip'
        required: true
        default: 'server.zip'

jobs:
  deploy:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack
        run: |
          cd "$GITHUB_WORKSPACE"

          echo "=== Workspace contents ==="
          ls -la
          echo "========================="

          for pkg in ${{ github.event.inputs.packages }}; do
            # 支持带路径的输入，如 world/halfserver1.zip
            if [ ! -f "$pkg" ]; then
              echo "ERROR: $pkg not found in workspace"
              exit 1
            fi

            dest=$(dirname "$pkg")
            echo "Unpacking $pkg -> $dest/"
            unzip -o "$pkg" -d "$dest"

            # 解压完删除原 zip
            rm -f "$pkg"
            echo "Deleted $pkg"
          done

      - name: Commit and push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "deploy: unpack ${{ github.event.inputs.packages }} [no ci]" || echo "nothing to commit"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git" "HEAD:${{ github.ref_name }}" --force
