name: Deploy (unpack)

on:
  workflow_dispatch:
    inputs:
      source:
        description: '填目录路径（如 world）或具体 zip 文件名（如 server.zip），多个用空格分隔'
        required: true
        default: '.'
      target_dir:
        description: '解压目标目录（相对于仓库根）。留空则解压到源所在目录'
        required: false
        default: ''

jobs:
  deploy:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Unpack
        run: |
          cd "$GITHUB_WORKSPACE"

          TARGET=""
          if [ -n "${{ github.event.inputs.target_dir }}" ]; then
            TARGET="$GITHUB_WORKSPACE/${{ github.event.inputs.target_dir }}"
            mkdir -p "$TARGET"
          fi

          for item in ${{ github.event.inputs.source }}; do
            if [ -d "$item" ]; then
              echo "Scanning directory: $item"
              ZIPS=$(find "$item" -maxdepth 1 -type f -name "*.zip")
            elif [ -f "$item" ]; then
              ZIPS="$item"
            else
              echo "ERROR: $item not found"
              exit 1
            fi

            if [ -z "$ZIPS" ]; then
              echo "ERROR: no zip files found in $item"
              exit 1
            fi

            for zipfile in $ZIPS; do
              if [ -z "$TARGET" ]; then
                DEST=$(dirname "$zipfile")
              else
                DEST="$TARGET"
              fi
              mkdir -p "$DEST"
              echo "Unpacking $zipfile -> $DEST/"
              unzip -o "$zipfile" -d "$DEST"
              rm -f "$zipfile"
              echo "Deleted $zipfile"
            done
          done

      - name: Commit and push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "deploy: unpack ${{ github.event.inputs.source }} [no ci]" || echo "nothing to committed"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git" "HEAD:${{ github.ref_name }}" --force
